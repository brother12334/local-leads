<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Leads</title><style>body{font:16px system-ui;margin:0;background:#f5f3eb;color:#173b30}header{background:#173b30;color:white;padding:30px 5%}main{max-width:1000px;margin:auto;padding:30px 5%}input,button,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid #bbb}button{background:#d9ed80;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:20px 0}.card,.panel{background:white;padding:20px;border-radius:12px}.muted{color:#667}textarea{width:100%;height:240px;box-sizing:border-box}</style><header><h1>Local Leads</h1><p>Find businesses in Boca Raton and across Florida, then plan personal outreach.</p></header><main><div class="row"><input id="place" value="Boca Raton, Florida" placeholder="Florida city or neighborhood"><input id="kind" placeholder="Business type, e.g. bakery"><button id="search">Find businesses</button></div><p class="muted">Uses OpenStreetMap listings. Check each business and website before reaching out.</p><p>Quick locations: <button type="button" onclick="document.getElementById('place').value='Boca Raton, Florida'">Boca Raton</button> <button type="button" onclick="document.getElementById('place').value='Miami, Florida'">Miami</button> <button type="button" onclick="document.getElementById('place').value='Orlando, Florida'">Orlando</button> <button type="button" onclick="document.getElementById('place').value='Tampa, Florida'">Tampa</button> <button type="button" onclick="document.getElementById('place').value='Jacksonville, Florida'">Jacksonville</button></p><p id="status"></p><div id="cards" class="cards"></div><section class="panel"><h2>Email draft</h2><input id="sender" placeholder="Your business name"><textarea id="email" placeholder="Select a business to draft an email."></textarea><button id="copy">Copy email</button></section></main><script src="app.js"></script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Leads</title><style>body{font:16px system-ui;margin:0;background:#f5f3eb;color:#173b30}header{background:#173b30;color:white;padding:30px 5%}main{max-width:1100px;margin:auto;padding:30px 5%}input,select,button,textarea{font:inherit;padding:11px;border-radius:8px;border:1px solid #bbc5bd}button{background:#d9ed80;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:190px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:20px 0}.card,.panel{background:white;padding:20px;border-radius:12px}.card button{margin:4px}.muted{color:#667}.tag{background:#edf1df;border-radius:20px;padding:5px 9px;display:inline-block}textarea{width:100%;height:220px;box-sizing:border-box}a{color:#17664b}</style><header><h1>Local Leads</h1><p>Review businesses in Boca Raton and across Florida.</p></header><main><div class="row"><input id="place" value="Boca Raton, Florida" aria-label="Location"><select id="kind" aria-label="Business type"><option value="all">All business types</option><option value="restaurant">Restaurants</option><option value="cafe">Cafes</option><option value="bakery">Bakeries</option><option value="hairdresser">Hair salons</option><option value="dentist">Dentists</option><option value="plumber">Plumbers</option></select><button id="search">Find businesses</button></div><p class="muted">Searches a 5 km area. Map listings may omit a business’s website. Check each lead before using it.</p><div class="row"><label for="filter">Show</label><select id="filter"><option value="unlisted">No website listed</option><option value="verified">Checked: no website found</option><option value="all">All listings</option><option value="website">Website listed or found</option></select><span id="status" aria-live="polite"></span></div><div id="cards" class="cards"></div><section class="panel"><h2>Email draft</h2><p class="muted">Only send after checking the business and adding a genuine observation.</p><input id="sender" placeholder="Your business name"><textarea id="email" placeholder="Select a business to draft an email."></textarea><button id="copy">Copy email</button></section></main><script src="app.js?v=4"></script></html>
